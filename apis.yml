name: Onera (acquired by Lyniate in 2021)
description: >-
  Onera, Inc. was a San Francisco-based retail technology company that built a
  real-time inventory availability and omnichannel order fulfillment platform.
  Its "Onera Decision Engine" connected inventory events across siloed retail
  systems into a single real-time source of inventory truth and used machine
  learning to determine optimal fulfillment locations for orders, serving
  retailers such as Gap, Old Navy, Torrid, rue21, and Zumiez. Founded circa
  2014 and backed by Bain Capital Ventures and Founder's Collective, Onera was
  acquired by supply-chain planning and optimization vendor ToolsGroup in June
  2022, where its real-time inventory and fulfillment capabilities were folded
  into the ToolsGroup retail platform. NOTE: the "acquired by Lyniate in 2021"
  in this record's slug/name is incorrect harvested metadata; the verified
  acquirer is ToolsGroup (2022). The company no longer operates a standalone
  public developer portal or API surface.
